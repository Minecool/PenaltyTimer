name: Build Penalty Timer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: PenaltyTimer
            binary: target/release/PenaltyTimer
            extension: ""
          - os: windows-latest
            artifact_name: PenaltyTimer
            binary: target/release/PenaltyTimer.exe
            extension: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          dashed_version="${version//./-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dashed_version=$dashed_version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Rename binary
        shell: bash
        run: |
          mv "${{ matrix.binary }}" "${{ matrix.artifact_name }}-${{ steps.version.outputs.dashed_version }}${{ matrix.extension }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ steps.version.outputs.dashed_version }}${{ matrix.extension }}
          path: ${{ matrix.artifact_name }}-${{ steps.version.outputs.dashed_version }}${{ matrix.extension }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: version
        shell: bash
        run: |
          version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          dashed_version="${version//./-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dashed_version=$dashed_version" >> "$GITHUB_OUTPUT"

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: PenaltyTimer-${{ steps.version.outputs.dashed_version }}
          path: release

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: PenaltyTimer-${{ steps.version.outputs.dashed_version }}.exe
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }} Release Builds
          files: |
            release/PenaltyTimer-${{ steps.version.outputs.dashed_version }}-Linux
            release/PenaltyTimer-${{ steps.version.outputs.dashed_version }}.exe
